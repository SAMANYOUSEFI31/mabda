# Private research copy of Mabda for the owner's own testing (a SECOND Render service; the main Blueprint render.yaml is untouched).
# Deploys this branch only. Sign-in is the owner's key (MABDA_OWNER_CODE, generated by Render); nobody without it sees anything.
# Free plan = no persistent disk: the SQLite file is wiped on every deploy and after the service sleeps/restarts. That is fine for
# looking at the work with the owner sample (MABDA_ALLOW_SAMPLES=1); switch `plan` to starter and add the disk below to keep data.
services:
  - type: web
    name: mabda-research
    runtime: docker
    plan: free
    branch: claude/project-thread-6dx0vn
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: MABDA_OWNER_CODE
        generateValue: true
      - key: MABDA_ALLOW_SAMPLES
        value: "1"
      - key: MABDA_MANAGED_AI
        value: "false"
    # disk (paid plans only):
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and then set MABDA_DB_PATH=/var/data/mabda.sqlite, MABDA_BACKUP_DIR=/var/data/backups
