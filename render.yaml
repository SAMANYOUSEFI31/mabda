# Render Blueprint: one online address, rebuilt automatically on every merge to main.
# Behind a password (the app has no login yet). The password is generated by Render; see docs/deploy.md.
services:
  - type: web
    name: mabda
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: MABDA_ACCESS_PASSWORD
        generateValue: true
      - key: MABDA_MANAGED_AI
        value: "false"
