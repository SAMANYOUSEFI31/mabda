# Render Blueprint: one online address for the ~10-person test, rebuilt automatically on every merge to main.
# Sign-in is per person (personal invite links, server/auth). The owner's key is generated by Render; see docs/deploy.md.
# Data lives on a persistent disk (a disk needs a paid plan: on the free plan every deploy or sleep would empty the database).
services:
  - type: web
    name: mabda
    runtime: docker
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MABDA_OWNER_CODE
        generateValue: true
      - key: MABDA_DB_PATH
        value: /var/data/mabda.sqlite
      - key: MABDA_BACKUP_DIR
        value: /var/data/backups
      - key: MABDA_MANAGED_AI
        value: "false"
