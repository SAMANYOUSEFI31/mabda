# !!! RESEARCH BRANCH ONLY: do NOT merge this file into main as is. !!!
# On main, render.yaml is the paid Starter service with a persistent disk. Here it is the FREE variant for private testing
# of branch claude/project-thread-6dx0vn (no card needed). Sign-in is the owner's key MABDA_OWNER_CODE (generated by Render).
# Free plan = no disk: the SQLite file is wiped on every deploy and after the service sleeps; the owner sample is offered again.
services:
  - type: web
    name: mabda
    runtime: docker
    plan: free
    branch: claude/project-thread-6dx0vn
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: MABDA_OWNER_CODE
        generateValue: true
      - key: MABDA_ALLOW_SAMPLES
        value: "1"
      - key: MABDA_MANAGED_AI
        value: "false"
