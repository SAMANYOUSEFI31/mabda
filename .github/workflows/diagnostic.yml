name: diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [all, without-import, without-backup, without-privacy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore main files for isolated scope
        shell: bash
        run: |
          case "${{ matrix.scope }}" in
            without-import)
              git checkout origin/main -- src/components/context/ImportAnswerDialog.tsx src/app/shell/useRemovalAndDialogs.tsx
              ;;
            without-backup)
              git checkout origin/main -- server/db/workspaceBackup.ts server/db/workspaceBackup.test.ts
              ;;
            without-privacy)
              git checkout origin/main -- server/app.ts
              ;;
          esac
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
