# The same three gates CLAUDE.md asks for before every hand-off: typecheck, tests, build (build runs check:design and the token
# drift check first). The tests run twice: on SQLite, then every in-memory test database on a fresh schema of a real Postgres 16
# (MABDA_TEST_DATABASE_URL, server/db/database.ts), so the production engine and its Postgres-only tests are checked too. Then the regression guards (`bun run test:guards`,
# docs/ux/decisions.md §۵۳): a real server on a temp SQLite and Chromium, so a decided UX point cannot be undone unnoticed.
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mabda
          POSTGRES_PASSWORD: mabda
          POSTGRES_DB: mabda_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mabda -d mabda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4  # the same as the Dockerfile
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: test (SQLite)
        run: bun run test
      - name: test (Postgres 16)
        run: bun run test
        env:
          MABDA_TEST_DATABASE_URL: postgres://mabda:mabda@localhost:5432/mabda_test
      - run: bun run build
      - name: browser for the guards
        run: npx playwright install --with-deps chromium
      - name: regression guards
        run: bun run test:guards
