name: Apply bounded supersede patch

on:
  push:
    branches:
      - copilot/pretest-hardening-rebuild
    paths:
      - .github/workflows/apply-supersede-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/pretest-hardening-rebuild
          fetch-depth: 0
      - name: Apply exact patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: exact target count={text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/services/dataApi.ts',
              "nodeId: string; reason?: string; expectedUpdatedAt?: string }) =>\n    call<{ object: ContextObject; previous: ContextObject; impact: ImpactInfo; relationships: ContextRelationship[]; stale: StaleAsset[] }>('POST', `${ws(id)}/objects/${objectId}/supersede`, input),",
              "nodeId: string; slotKey?: string; reach?: ContextObject['reach']; validUntil?: string; assumption?: boolean; reviewBy?: string; record?: import('../types').DecisionRecord; facets?: string[]; examples?: import('../types').RedlineExample[]; reason?: string; expectedUpdatedAt?: string }) =>\n    call<{ object: ContextObject; previous: ContextObject; impact: ImpactInfo; relationships: ContextRelationship[]; stale: StaleAsset[] }>('POST', `${ws(id)}/objects/${objectId}/supersede`, input),",
          )

          replace_once(
              'server/db/repo/objects.ts',
              "...thinkingFields({ type: input.type, assumption: input.assumption ?? old.assumption, reviewBy: input.reviewBy ?? old.reviewBy, record: input.record ?? old.record }), ...(canHaveExamples",
              "...thinkingFields({ type: input.type, assumption: input.assumption ?? old.assumption, reviewBy: input.reviewBy ?? old.reviewBy, record: input.record ?? old.record }), ...(cleanFacets(input.facets ?? old.facets) ? { facets: cleanFacets(input.facets ?? old.facets) } : {}), ...(canHaveExamples",
          )

          p = Path('server/db/supersede.test.ts')
          text = p.read_text()
          marker = "test('CORE-11: supersede preserves semantic fields'"
          if marker in text:
              raise SystemExit('regression test already exists')
          text += r'''

test('CORE-11: supersede preserves semantic fields', () => {
  const { repo, s, top } = fresh();
  const old = repo.createObject(s, {
    type: 'Constraint', provenance: 'User Input', title: 'قدیم', content: 'قدیم', nodeId: top.id,
    slotKey: 'guardrail', reach: 'global', validUntil: '2027-01-01', facets: [' سازمانی ', 'پاییز'],
    examples: [{ kind: 'good', text: 'شفاف' }, { kind: 'bad', text: 'مبهم' }],
  });
  const replacement = repo.supersedeObject(s, old.id, {
    type: 'Constraint', provenance: 'User Input', title: 'جدید', content: 'جدید', nodeId: top.id,
    slotKey: old.slotKey, reach: old.reach, validUntil: old.validUntil, facets: old.facets, examples: old.examples,
  }).object;
  assert.equal(replacement.slotKey, 'guardrail');
  assert.equal(replacement.reach, 'global');
  assert.equal(replacement.validUntil, '2027-01-01');
  assert.deepEqual(replacement.facets, ['سازمانی', 'پاییز']);
  assert.deepEqual(replacement.examples, old.examples);

  const assumption = repo.createObject(s, {
    type: 'Fact', provenance: 'User Input', title: 'فرض', content: 'فرض', nodeId: top.id,
    assumption: true, reviewBy: '2026-12-15',
  });
  const nextAssumption = repo.supersedeObject(s, assumption.id, {
    type: 'Fact', provenance: 'User Input', title: 'فرض تازه', content: 'فرض تازه', nodeId: top.id,
    assumption: assumption.assumption, reviewBy: assumption.reviewBy,
  }).object;
  assert.equal(nextAssumption.assumption, true);
  assert.equal(nextAssumption.reviewBy, '2026-12-15');

  const decision = repo.createObject(s, {
    type: 'Decision', provenance: 'User Input', title: 'تصمیم', content: 'تصمیم', nodeId: top.id,
    record: { question: 'کدام؟', expectation: 'بهتر شود', reviewOn: '2026-12-20' },
  });
  const nextDecision = repo.supersedeObject(s, decision.id, {
    type: 'Decision', provenance: 'User Input', title: 'تصمیم تازه', content: 'تصمیم تازه', nodeId: top.id,
    record: decision.record,
  }).object;
  assert.deepEqual(nextDecision.record, decision.record);
});
'''
          p.write_text(text)
          Path('.github/workflows/apply-supersede-fix.yml').unlink()
          PY
      - name: Audit patch
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' '.github/workflows/apply-supersede-fix.yml' 'server/db/repo/objects.ts' 'server/db/supersede.test.ts' 'src/services/dataApi.ts' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Commit bounded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix supersede: preserve semantic fields end to end"
          git push origin HEAD:copilot/pretest-hardening-rebuild
