name: Recover dataApi

on:
  push:
    branches:
      - copilot/pretest-hardening-rebuild
    paths:
      - .github/workflows/recover-data-api.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: copilot/pretest-hardening-rebuild

      - name: Restore known-good dataApi
        run: |
          git show 9cb9e00974271aa03f3e944f48e655e011d532bd:src/services/dataApi.ts > src/services/dataApi.ts
          test "$(git hash-object src/services/dataApi.ts)" = "61d7703bd7de1ce3eed48ea3958fabdfa8314011"

      - name: Commit exact recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/dataApi.ts
          git diff --cached --exit-code && exit 1 || true
          git commit -m "recovery: restore dataApi from known-good blob"
          git push origin HEAD:copilot/pretest-hardening-rebuild
