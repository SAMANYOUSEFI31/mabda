name: Finish Supersede Fix

on:
  push:
    branches: [copilot/pretest-hardening-rebuild]
    paths: [.github/workflows/finish-supersede.yml]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mabda
          POSTGRES_PASSWORD: mabda
          POSTGRES_DB: mabda_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mabda -d mabda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/pretest-hardening-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Apply bounded exact patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new))

          replace_exact(
              'src/services/dataApi.ts',
              "supersedeObject: (id: string, objectId: string, input: { type: ContextType; status?: ContextStatus; provenance: ContextProvenance; title: string; content: string; nodeId: string; reason?: string; expectedUpdatedAt?: string }) =>",
              "supersedeObject: (id: string, objectId: string, input: { type: ContextType; status?: ContextStatus; provenance: ContextProvenance; title: string; content: string; nodeId: string; slotKey?: string; reach?: ContextObject['reach']; validUntil?: string; assumption?: boolean; reviewBy?: string; record?: import('../types').DecisionRecord; facets?: string[]; examples?: import('../types').RedlineExample[]; reason?: string; expectedUpdatedAt?: string }) =>",
          )

          replace_exact(
              'server/db/repo/objects.ts',
              "...thinkingFields({ type: input.type, assumption: input.assumption ?? old.assumption, reviewBy: input.reviewBy ?? old.reviewBy, record: input.record ?? old.record }), ...(canHaveExamples({ type: input.type, reach: input.reach ?? old.reach }) && cleanExamples(input.examples ?? old.examples) ? { examples: cleanExamples(input.examples ?? old.examples) } : {}), createdAt: t, updatedAt: t };",
              "...thinkingFields({ type: input.type, assumption: input.assumption ?? old.assumption, reviewBy: input.reviewBy ?? old.reviewBy, record: input.record ?? old.record }), ...(cleanFacets(input.facets ?? old.facets) ? { facets: cleanFacets(input.facets ?? old.facets) } : {}), ...(canHaveExamples({ type: input.type, reach: input.reach ?? old.reach }) && cleanExamples(input.examples ?? old.examples) ? { examples: cleanExamples(input.examples ?? old.examples) } : {}), createdAt: t, updatedAt: t };",
          )

          test_path = Path('server/db/supersede.test.ts')
          test_text = test_path.read_text()
          marker = "test('CORE-11: supersede preserves every supported semantic field'"
          if marker not in test_text:
              test_text += r'''

test('CORE-11: supersede preserves every supported semantic field', () => {
  const { repo, s, top } = fresh();
  const constraint = repo.createObject(s, {
    type: 'Constraint', provenance: 'User Input', title: 'قدیم', content: 'قدیم', nodeId: top.id,
    slotKey: 'guardrail', reach: 'global', validUntil: '2027-01-01', facets: [' سازمانی ', 'پاییز'],
    examples: [{ kind: 'good', text: 'شفاف' }, { kind: 'bad', text: 'مبهم' }],
  });
  const replacedConstraint = repo.supersedeObject(s, constraint.id, {
    type: 'Constraint', provenance: 'User Input', title: 'جدید', content: 'جدید', nodeId: top.id,
    slotKey: constraint.slotKey, reach: constraint.reach, validUntil: constraint.validUntil,
    facets: constraint.facets, examples: constraint.examples,
  }).object;
  assert.equal(replacedConstraint.slotKey, 'guardrail');
  assert.equal(replacedConstraint.reach, 'global');
  assert.equal(replacedConstraint.validUntil, '2027-01-01');
  assert.deepEqual(replacedConstraint.facets, ['سازمانی', 'پاییز']);
  assert.deepEqual(replacedConstraint.examples, constraint.examples);

  const assumption = repo.createObject(s, {
    type: 'Fact', provenance: 'User Input', title: 'فرض', content: 'فرض', nodeId: top.id,
    assumption: true, reviewBy: '2026-12-15',
  });
  const replacedAssumption = repo.supersedeObject(s, assumption.id, {
    type: 'Fact', provenance: 'User Input', title: 'فرض تازه', content: 'فرض تازه', nodeId: top.id,
    assumption: assumption.assumption, reviewBy: assumption.reviewBy,
  }).object;
  assert.equal(replacedAssumption.assumption, true);
  assert.equal(replacedAssumption.reviewBy, '2026-12-15');

  const decision = repo.createObject(s, {
    type: 'Decision', provenance: 'User Input', title: 'تصمیم', content: 'تصمیم', nodeId: top.id,
    record: { question: 'کدام؟', expectation: 'بهتر شود', reviewOn: '2026-12-20' },
  });
  const replacedDecision = repo.supersedeObject(s, decision.id, {
    type: 'Decision', provenance: 'User Input', title: 'تصمیم تازه', content: 'تصمیم تازه', nodeId: top.id,
    record: decision.record,
  }).object;
  assert.deepEqual(replacedDecision.record, decision.record);
});
'''
              test_path.write_text(test_text)

          Path('.github/workflows/finish-supersede.yml').unlink()
          PY

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: test SQLite
        run: bun run test
      - name: test Postgres
        run: bun run test
        env:
          MABDA_TEST_DATABASE_URL: postgres://mabda:mabda@localhost:5432/mabda_test
      - run: bun run build

      - name: Audit exact diff scope
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' '.github/workflows/finish-supersede.yml' 'server/db/repo/objects.ts' 'server/db/supersede.test.ts' 'src/services/dataApi.ts' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git diff -- src/services/dataApi.ts server/db/repo/objects.ts server/db/supersede.test.ts

      - name: Commit verified unit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix supersede: preserve semantic fields end to end"
          git push origin HEAD:copilot/pretest-hardening-rebuild
