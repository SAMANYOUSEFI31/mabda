name: Recover useBoards

on:
  push:
    branches: [copilot/pretest-hardening-rebuild]
    paths: [.github/workflows/recover-useboards.yml]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/pretest-hardening-rebuild
          fetch-depth: 0
      - name: Restore last-green useBoards and remove workflow
        run: |
          git show f79d26fc9d2cfcc77f657b44a07cfaa71de27283:src/app/canvas/useBoards.ts > src/app/canvas/useBoards.ts
          test "$(git hash-object src/app/canvas/useBoards.ts)" = "afcc5f4817abd389ec56bd7f6417ed70348e14f1"
          rm .github/workflows/recover-useboards.yml
      - name: Commit exact recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "recovery: restore useBoards to last green blob"
          git push origin HEAD:copilot/pretest-hardening-rebuild
