<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مبدأ — منبع حقیقت کسب‌وکار</title>
    <meta name="description" content="پلتفرم تبدیل دانش و گفتگوهای پراکنده به دارایی‌های منسجم، با موتور تحلیل شکاف (Gap Engine)، درخت دانش نوع‌دار و Context Replay." />
    <meta property="og:title" content="مبدأ — منبع حقیقت کسب‌وکار" />
    <meta property="og:description" content="پلتفرم تبدیل دانش و گفتگوهای پراکنده به دارایی‌های منسجم، با موتور تحلیل شکاف (Gap Engine)، درخت دانش نوع‌دار و Context Replay." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf5f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1713" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/vazirmatn-arabic-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- appearance before first paint (no flash): the viewer's choice (src/ui/theme.ts), else the system's -->
    <script>
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('mabda:theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body class="min-h-screen bg-surface-page text-text-default antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
